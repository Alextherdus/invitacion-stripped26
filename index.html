
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2eeee">
    <title>Birthday Invitation · Stripped</title>

    <link rel="stylesheet" href="style.css?v=7">
</head>

<body>
    <main class="page">

        <section class="music-player">
            <div class="player-label">NOW PLAYING</div>

            <div class="player-main">
                <span id="song-title">Stripped Pt. 2</span>

                <div class="player-controls">
                    <button id="play-button" type="button" aria-label="Reproducir">▶</button>
                    <button id="pause-button" type="button" aria-label="Pausar">❚❚</button>
                </div>
            </div>
        </section>

        <section class="album-container">

            <div class="disc" aria-hidden="true">
                <div class="disc-grooves"></div>
                <div class="disc-label"></div>
                <div class="disc-hole"></div>
            </div>

            <div class="album-cover" id="album-cover">
                <div class="cover-inner" id="cover-inner">

                    <div class="cover-front">
                        <img src="assets/portada.jpg" alt="Portada del álbum" draggable="false">
                    </div>

                    <div class="cover-back">
                        <img src="assets/contraportada.jpg" alt="Contraportada del álbum" draggable="false">

                        <a
                            class="qr-hotspot"
                            href="https://maps.app.goo.gl/zAR4qGoBALCJjZjS7"
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="Abrir ubicación de la fiesta"
                        ></a>
                    </div>

                </div>
            </div>

        </section>

        <div class="bottom-text">DRAG TO DISCOVER</div>

        <audio id="album-audio" preload="none"></audio>

    </main>

    <script src="script.js?v=5"></script>
</body>
</html>
